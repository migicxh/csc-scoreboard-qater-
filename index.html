
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSC Broadcast Overlay</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="competitionTitle">CSC PREMIER LEAGUE</div>

<div id="scoreboard">

    <div class="team left">
        <div id="homeTeam">HOME</div>
    </div>

    <div class="scoreBox">
        <span id="homeScore">0</span>
        <span>-</span>
        <span id="awayScore">0</span>
    </div>

    <div class="team right">
        <div id="awayTeam">AWAY</div>
    </div>

</div>

<div id="matchInfo">
    <div id="timer">00:00</div>
    <div id="matchStatus">1ST HALF</div>
</div>

<div id="goalBanner">⚽ GOAL!</div>

<script src="overlay.js"></script>

</body>
</html>
