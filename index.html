
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC Broadcast Overlay</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animations.css">
</head>

<body>

<div id="competitionTitle">
    CSC PREMIER LEAGUE
</div>

<div id="scoreboard">

    <div class="team left">
        <img id="homeLogo" alt="Home Logo">
        <div class="teamName" id="homeTeam">HOME</div>
    </div>

    <div class="centerBox">

        <div class="timer" id="timer">00:00</div>

        <div class="score">
            <span id="homeScore">0</span>
            <span class="dash">-</span>
            <span id="awayScore">0</span>
        </div>

        <div class="status" id="matchStatus">1ST HALF</div>

    </div>

    <div class="team right">
        <div class="teamName" id="awayTeam">AWAY</div>
        <img id="awayLogo" alt="Away Logo">
    </div>

</div>

<div id="goalBanner">
    ⚽ GOAL!
</div>

<script src="overlay.js"></script>

</body>
</html>
