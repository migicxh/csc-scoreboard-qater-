
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VRFS World Cup Overlay</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="header">

    <div id="competitionTitle">
        🏆 VRFS WORLD CUP
    </div>

    <div id="logoHolder">
        <img id="vrfsLogo" src="vrfs-logo.png" alt="VRFS">
    </div>

</div>

<div id="scoreboard">

    <div class="team left">
        <div id="homeTeam">HOME</div>
    </div>

    <div class="scoreBox">
        <span id="homeScore">0</span>
        <span class="divider">-</span>
        <span id="awayScore">0</span>
    </div>

    <div class="team right">
        <div id="awayTeam">AWAY</div>
    </div>

</div>

<div id="matchInfo">

    <div id="timer">00:00</div>

    <div id="matchStatus">1ST HALF</div>

</div>

<div id="goalBanner">⚽ GOAL!</div>

<script src="overlay.js"></script>

</body>
</html>
