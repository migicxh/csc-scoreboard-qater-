
<div class="section full">
<h2>Competition</h2>

<input id="competition" placeholder="VRFS WORLD CUP">

<button class="blue" onclick="updateCompetition()">Update Competition</button>
</div>

<div class="section">
<h2>Home Team</h2>

<input id="homeTeam" placeholder="Home Team">

<button class="blue" onclick="updateTeams()">Update Teams</button>
</div>

<div class="section">
<h2>Away Team</h2>

<input id="awayTeam" placeholder="Away Team">

<button class="blue" onclick="updateTeams()">Update Teams</button>
</div>

<div class="section">
<h2>Tournament Logo</h2>

<input
id="tournamentLogo"
placeholder="images/vrfs-logo.png">

<button class="blue" onclick="updateTournamentLogo()">
Update Logo
</button>
</div>

<div class="section">
<h2>Home Logo</h2>

<input
id="homeLogo"
placeholder="images/home.png">

<button class="blue" onclick="updateHomeLogo()">
Update Logo
</button>
</div>

<div class="section">
<h2>Away Logo</h2>

<input
id="awayLogo"
placeholder="images/away.png">

<button class="blue" onclick="updateAwayLogo()">
Update Logo
</button>
</div>

<div class="section">
<h2>Added Time</h2>

<input
id="addedTime"
placeholder="+5">

<button
class="orange"
onclick="updateAddedTime()">
Update
</button>
</div>

<div class="section">
<h2>Home Score</h2>

<div class="controls">
<button class="green" onclick="homePlus()">+</button>
<button class="red" onclick="homeMinus()">−</button>
</div>
</div>

<div class="section">
<h2>Away Score</h2>

<div class="controls">
<button class="green" onclick="awayPlus()">+</button>
<button class="red" onclick="awayMinus()">−</button>
</div>
</div>

<div class="section full">
<h2>Timer</h2>

<div class="controls">
<button class="green" onclick="startTimer()">▶ Start</button>
<button class="blue" onclick="pauseTimer()">⏸ Pause</button>
<button class="red" onclick="resetTimer()">↺ Reset</button>
</div>
</div>

<div class="section">
<h2>Goal</h2>

<button class="orange" onclick="showGoal()">
⚽ GOAL
</button>
</div>

<div class="section">
<h2>Match Status</h2>

<div class="controls">
<button onclick="setStatus('1ST HALF')">1ST</button>
<button onclick="setStatus('HALFTIME')">HT</button>
<button onclick="setStatus('2ND HALF')">2ND</button>
<button onclick="setStatus('FULLTIME')">FT</button>
</div>
</div>
