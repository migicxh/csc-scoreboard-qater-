
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSC Scoreboard Control</title>

<style>
body{
    margin:0;
    padding:30px;
    background:#202124;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

h1{
    margin-bottom:25px;
}

.panel{
    background:#2b2b2b;
    padding:20px;
    border-radius:12px;
    max-width:700px;
}

input{
    width:250px;
    padding:10px;
    font-size:18px;
    margin:5px;
}

button{
    padding:10px 18px;
    margin:5px;
    font-size:18px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

.green{background:#28a745;color:white;}
.red{background:#dc3545;color:white;}
.blue{background:#0d6efd;color:white;}
.orange{background:#ff9800;color:white;}

.score{
    font-size:26px;
    margin:20px 0;
}
</style>

</head>

<body>

<h1>CSC Scoreboard Control</h1>

<div class="panel">

<h2>Competition</h2>

<input id="competition" placeholder="CSC PREMIER LEAGUE">

<button class="blue" onclick="updateCompetition()">Update Competition</button>

<hr>

<h2>Teams</h2>

<input id="homeTeam" placeholder="Home Team">
<input id="awayTeam" placeholder="Away Team">

<br><br>

<button class="blue" onclick="updateTeams()">Update Teams</button>

<hr>

<h2>Score</h2>

<div class="score">
HOME
<button class="green" onclick="homePlus()">+</button>
<button class="red" onclick="homeMinus()">-</button>
</div>

<div class="score">
AWAY
<button class="green" onclick="awayPlus()">+</button>
<button class="red" onclick="awayMinus()">-</button>
</div>

<hr>

<h2>Timer</h2>

<button class="green" onclick="startTimer()">▶ Start</button>
<button class="blue" onclick="pauseTimer()">⏸ Pause</button>
<button class="red" onclick="resetTimer()">↺ Reset</button>

<hr>

<h2>Goal Animation</h2>

<button class="orange" onclick="showGoal()">⚽ GOAL</button>

<hr>

<h2>Match Status</h2>

<button onclick="setStatus('1ST HALF')">1ST HALF</button>
<button onclick="setStatus('HALFTIME')">HALFTIME</button>
<button onclick="setStatus('2ND HALF')">2ND HALF</button>
<button onclick="setStatus('FULLTIME')">FULLTIME</button>

</div>

<script src="control.js"></script>

</body>
</html>
