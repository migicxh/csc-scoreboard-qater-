
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSC Scoreboard Control</title>

<style>
body{
    margin:0;
    padding:30px;
    background:#202124;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

h1{
    margin-bottom:25px;
}

.panel{
    background:#2b2b2b;
    padding:20px;
    border-radius:12px;
    max-width:700px;
}

input{
    width:250px;
    padding:10px;
    font-size:18px;
    margin:5px;
}

button{
    padding:10px 18px;
    margin:5px;
    font-size:18px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

.green{background:#28a745;color:white;}
.red{background:#dc3545;color:white;}
.blue{background:#0d6efd;color:white;}

.score{
    font-size:34px;
    margin:20px 0;
}
</style>

</head>

<body>

<h1>CSC Scoreboard Control</h1>

<div class="panel">

<h2>Teams</h2>

<input id="homeTeam" placeholder="Home Team">
<input id="awayTeam" placeholder="Away Team">

<br><br>

<button class="blue">Update Teams</button>

<hr>

<h2>Score</h2>

<div class="score">

HOME

<button class="green">+</button>

<button class="red">-</button>

<span id="homeScore">0</span>

</div>

<div class="score">

AWAY

<button class="green">+</button>

<button class="red">-</button>

<span id="awayScore">0</span>

</div>

<hr>

<h2>Match</h2>

<button>Start Timer</button>
<button>Pause Timer</button>
<button>Reset Timer</button>

</div>

<script src="control.js"></script>

</body>
</html>
